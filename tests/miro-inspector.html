<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miro Clipboard Inspector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #1a1a2e; color: #e0e0e0;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    .hint { color: #888; margin: 0 0 16px; font-size: 0.9rem; }
    button {
      padding: 10px 20px; border: 0; border-radius: 8px;
      background: #0f766e; color: white; font-weight: 700;
      cursor: pointer; font-size: 1rem; margin-bottom: 16px;
    }
    button:hover { background: #115e59; }
    button.fallback { background: #555; }
    .section {
      margin-bottom: 20px; padding: 14px;
      background: #16213e; border-radius: 10px;
      border: 1px solid #333;
    }
    .section h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: #888; margin: 0 0 8px;
    }
    pre {
      margin: 0; padding: 12px; overflow: auto;
      background: #0f0f23; border-radius: 8px;
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 0.82rem; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      max-height: 400px;
    }
    .copy-btn {
      float: right; background: #333; font-size: 0.75rem;
      padding: 5px 12px; margin: 0;
    }
  </style>
</head>
<body>
  <h1>🔍 Miro Clipboard Inspector</h1>
  <p class="hint">Copy something in Miro (Cmd+C), then click "Read Clipboard" below.</p>

  <button id="read-btn">📋 Read Clipboard</button>
  <button id="read-fallback-btn" class="fallback">📋 Read Clipboard (fallback)</button>

  <div class="section">
    <h2>RAW HTML <button class="copy-btn" onclick="copyText('raw-html')">copy</button></h2>
    <pre id="raw-html">Waiting…</pre>
  </div>

  <div class="section">
    <h2>DECODED JSON <button class="copy-btn" onclick="copyText('decoded-json')">copy</button></h2>
    <pre id="decoded-json">Waiting…</pre>
  </div>

  <div class="section">
    <h2>WIDGET SUMMARY</h2>
    <pre id="widget-summary">Waiting…</pre>
  </div>

  <script>
    const BYTE_SHIFT = 59;

    document.getElementById('read-btn').addEventListener('click', readModern);
    document.getElementById('read-fallback-btn').addEventListener('click', readFallback);

    async function readModern() {
      try {
        const items = await navigator.clipboard.read({ unsanitized: ['text/html'] });
        let html = '';
        for (const item of items) {
          for (const type of item.types) {
            const blob = await item.getType(type);
            const text = await blob.text();
            if (type === 'text/html') html = text;
          }
        }
        if (!html) {
          document.getElementById('raw-html').textContent = 'No text/html found on clipboard.';
          return;
        }
        processHtml(html);
      } catch (err) {
        document.getElementById('raw-html').textContent =
          'Modern read failed: ' + (err.message || err) + '\n\nTry the fallback button.';
      }
    }

    async function readFallback() {
      const div = document.createElement('div');
      div.contentEditable = true;
      div.style.position = 'fixed';
      div.style.left = '-9999px';
      document.body.appendChild(div);

      div.addEventListener('paste', (e) => {
        e.preventDefault();
        const html = e.clipboardData.getData('text/html') || '';
        document.body.removeChild(div);
        if (html) processHtml(html);
        else document.getElementById('raw-html').textContent = 'No text/html in clipboard.';
      }, { once: true });

      div.focus();
      try {
        document.execCommand('paste');
      } catch (err) {
        document.getElementById('raw-html').textContent = 'Fallback failed: ' + (err.message || err);
        document.body.removeChild(div);
      }

      // Timeout safety
      setTimeout(() => {
        if (document.body.contains(div)) {
          document.body.removeChild(div);
        }
      }, 500);
    }

    function processHtml(html) {
      // Show raw HTML
      document.getElementById('raw-html').textContent = html.slice(0, 2000);

      // Find miro-data-v1 payload
      const match = html.match(/\(miro-data-v1\)([\s\S]*?)\(\/miro-data-v1\)/);
      if (!match) {
        document.getElementById('decoded-json').textContent =
          'No miro-data-v1 marker found in clipboard HTML.';
        document.getElementById('widget-summary').textContent = 'No Miro payload.';
        return;
      }

      const b64 = match[1];
      try {
        const bytes = Uint8Array.from(atob(b64), c => (c.charCodeAt(0) - BYTE_SHIFT + 256) % 256);
        const decoded = JSON.parse(new TextDecoder().decode(bytes));

        document.getElementById('decoded-json').textContent = JSON.stringify(decoded, null, 2);
        document.getElementById('widget-summary').textContent = summarize(decoded);
      } catch (err) {
        document.getElementById('decoded-json').textContent = 'Decode failed: ' + (err.message || err);
      }
    }

    function summarize(data) {
      const objects = data?.data?.objects ?? [];
      const lines = [];
      lines.push(`Envelope: version=${data.version}, host=${data.host}, copierType=${data.copierType}`);
      lines.push(`meta: ${JSON.stringify(data.meta)}`);
      lines.push(`Widget count: ${objects.length}`);
      lines.push('');

      for (const [i, obj] of objects.entries()) {
        const wtype = obj.widgetData?.type;
        const json = typeof obj.widgetData?.json === 'string'
          ? JSON.parse(obj.widgetData.json)
          : obj.widgetData?.json ?? {};
        const style = typeof json.style === 'string' ? JSON.parse(json.style) : (json.style ?? {});

        lines.push(`Widget ${i}: type=${wtype}, id=${obj.id}, initialId=${obj.initialId}`);
        if (obj.meta) lines.push(`  meta: ${JSON.stringify(obj.meta)}`);

        if (wtype === 'shape') {
          lines.push(`  shape: ${json.shape}`);
          lines.push(`  size: ${JSON.stringify(json.size)}`);
          lines.push(`  _position: ${JSON.stringify(json._position)}`);
          lines.push(`  style.st: ${style.st}, style.i: ${JSON.stringify(style.i)}, style.brr: ${style.brr}`);
        } else if (wtype === 'paint') {
          lines.push(`  points: ${json.points?.length ?? 0} points`);
          lines.push(`  size: ${JSON.stringify(json.size)}`);
          lines.push(`  _position: ${JSON.stringify(json._position)}`);
          lines.push(`  style.e: ${style.e}, style.lc: ${style.lc}, style.lo: ${style.lo}`);
        } else if (wtype === 'line') {
          lines.push(`  primary: ${JSON.stringify(json.primary)}`);
          lines.push(`  secondary: ${JSON.stringify(json.secondary)}`);
          lines.push(`  style: ${JSON.stringify(style)}`);
        } else {
          lines.push(`  json keys: ${Object.keys(json).join(', ')}`);
        }
        lines.push('');
      }

      return lines.join('\n');
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        // Visual feedback
      });
    }
  </script>
</body>
</html>
